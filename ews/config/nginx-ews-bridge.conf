# Nginx config for Stalwart JMAP-EWS Bridge
# Debian Trixie, PHP 8.4
# Plaats in /etc/nginx/sites-available/ews-bridge
# Activeer: ln -s /etc/nginx/sites-available/ews-bridge /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name ews.example.com;

    # Document root = public/ (configuratie/src staan buiten webroot)
    root /var/www/ews-bridge/ews/public;
    index index.php;

    # Access & error logs
    access_log /var/log/nginx/ews-bridge-access.log;
    error_log  /var/log/nginx/ews-bridge-error.log;

    # PHP-FPM upstream (Debian trixie default socket)
    set $php_socket unix:/run/php/php8.4-fpm.sock;

    # 1: routes voor EWS en Autodiscover → index.php
    location ~* ^/(ews|EWS)/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* ^/(autodiscover|Autodiscover)/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 2: algemene PHP-afhandeling (ook voor exacte /EWS/Exchange.asmx matches)
    location ~ \.php$ {
        fastcgi_pass $php_socket;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;

        # Buffer-aanpassingen voor SOAP (grote XML)
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
        fastcgi_read_timeout 120;
    }

    # 3: deny toegang tot interne bestanden
    location ~* ^/(config|src|bootstrap\.php|compat\.php|run\.php) {
        deny all;
        return 404;
    }

    # 4: robuuste security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy no-referrer;
}

